[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-state"
version = "0.4.0"
description = "Save and restore GNOME, Chrome, Alacritty, tmux, and Codex workspaces"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sage-Cat"}]

[project.scripts]
wsctl = "workspace_state.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
