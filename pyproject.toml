[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-state"
version = "0.8.2"
description = "Save, restore, and safely prepare GNOME workspaces for shutdown"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sage-Cat"}]

[project.scripts]
wsctl = "workspace_state.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
