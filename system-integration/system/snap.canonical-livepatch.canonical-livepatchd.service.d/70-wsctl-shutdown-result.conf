# Livepatch v11.0.2 returns 1 after its normal "daemon shutting down" exit.
# Exit 1 is ONLY clean if the mandatory stop-post validator proves an actual
# OS shutdown and a fresh completion record from this exact invocation.
# Unexpected exit 1 still fails the unit via ExecStopPost and is restartable.
[Unit]
After=systemd-journald.service

[Service]
SuccessExitStatus=1
# Remap ANY validator failure (including Python startup/runtime failure) to
# a code outside SuccessExitStatus. systemd 255 applies it to stop hooks too.
ExecStopPost=/bin/sh -c '/usr/local/libexec/wsctl-livepatch-stop-check || exit 2'
