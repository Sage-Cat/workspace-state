# The snap wrapper uses `set -e; wait $PID`, including for its proxy-mode
# placeholder. Its own stop command sends TERM, producing shell status 143.
# This is the shell equivalent of SIGTERM (already a clean service signal),
# not a blanket allowance for configuration/startup errors such as exit 1.
[Unit]
After=snap.cups.cupsd.service avahi-daemon.service

[Service]
SuccessExitStatus=143
